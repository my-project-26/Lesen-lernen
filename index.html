<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lern-App">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFF8EF">
<title>Lern-App</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF8EF; --card:#fff; --ink:#2B2A33; --muted:#6B6878;
  --coral:#FF7A59; --coral-d:#E85F3D; --mint:#DDF5EA; --mint-d:#2E9E6E;
  --lav:#ECE6FF; --lav-d:#6C4FD8; --sun:#FFD166; --line:#EFE6D8;
  --syl-a:#1F6FEB; --syl-b:#D7263D;
  --radius:22px; --shadow:0 4px 0 rgba(0,0,0,.05),0 10px 24px rgba(60,40,20,.08);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Andika',system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;touch-action:manipulation}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(255,248,239,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:2px solid var(--line)}
.brand{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:24px;border:0;background:none;padding:0;color:var(--ink)}
.stars-total{margin-left:auto;background:#fff;border-radius:999px;padding:6px 16px;font-weight:700;font-size:18px;box-shadow:var(--shadow)}
main{max-width:980px;margin:0 auto;padding:20px 16px 150px}
h1,h2,h3{font-family:'Baloo 2',sans-serif;line-height:1.15;margin:0 0 12px}
h1{font-size:34px} h2{font-size:26px} h3{font-size:21px}
.sub{color:var(--muted);font-size:20px;margin:0 0 20px}
.muted{color:var(--muted)}
.center{text-align:center;justify-content:center}
.hidden{display:none!important}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.theme-card{border:0;border-radius:var(--radius);padding:24px 16px;background:var(--c,#fff);box-shadow:var(--shadow);text-align:center;color:var(--ink);transition:transform .12s}
.theme-card:active{transform:scale(.97)}
.theme-card .emo{font-size:64px;display:block;line-height:1.1}
.theme-card .nm{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:24px;display:block;margin-top:6px}
.theme-card .pr{font-size:16px;color:var(--muted)}
.btn{border:0;border-radius:16px;padding:12px 20px;font-size:20px;font-weight:700;background:#fff;color:var(--ink);box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:8px;justify-content:center;min-height:56px;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--coral);color:#fff}
.btn.mint{background:var(--mint-d);color:#fff}
.btn.danger{background:#FFE5E5;color:#B42318}
.btn.small{font-size:17px;padding:8px 14px;min-height:46px;border-radius:12px}
.btn.big{font-size:26px;padding:16px 30px;min-height:72px;border-radius:20px}
.btn[aria-pressed="true"]{outline:3px solid var(--coral);background:#FFF0EA}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.inp{font-size:22px;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:#fffdf9;min-width:0;flex:1 1 220px}
.panel{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin:12px 0}
.tip{background:#FFF4D6;border-radius:16px;padding:14px 16px;font-size:18px;line-height:1.5}
.back{margin-bottom:14px}
.text-list{display:grid;gap:14px}
.text-item{display:flex;align-items:center;gap:16px;border:0;width:100%;text-align:left;background:#fff;border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);color:var(--ink)}
.lvl{font-size:15px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--mint);color:var(--mint-d);white-space:nowrap}
.text-item .t{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px;display:block}
.text-item .m{color:var(--muted);font-size:16px}
.starrow{margin-left:auto;font-size:24px;white-space:nowrap;letter-spacing:2px}
.star-off{filter:grayscale(1);opacity:.25}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 12px}
.tab{border:0;border-radius:16px;padding:8px 6px;background:#fff;box-shadow:var(--shadow);font-size:17px;font-weight:700;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:68px}
.tab .i{font-size:26px}
.tab.active{background:var(--coral);color:#fff}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 4px}
.status{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:26px;text-align:center;margin:2px 0 10px}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-weight:700;font-size:15px}
.chip.c1{background:#BFEBD6} .chip.c2{background:#D9CCFF}
.rate select{font-size:18px;padding:8px 10px;border-radius:12px;border:2px solid var(--line);background:#fff;margin-left:6px}
.reading{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:26px clamp(18px,4vw,44px);font-size:var(--fs,30px);line-height:1.95;letter-spacing:.02em;word-spacing:.14em;margin-top:12px}
.reading h2{font-size:1.05em;margin-bottom:.4em}
.reading p{margin:0 0 .8em}
.sent{border-radius:10px;transition:background .2s,opacity .2s,box-shadow .2s;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.focus .sent{opacity:.25}
.focus .sent.cur{opacity:1}
.sent.cur{background:#FFF1C9;box-shadow:0 0 0 5px #FFF1C9}
.tandem .sent.r-child{background:#EEF9F3}
.tandem .sent.r-parent{background:#F5F1FF}
.tandem .sent.cur.r-child{background:#BFEBD6;box-shadow:0 0 0 5px #BFEBD6}
.tandem .sent.cur.r-parent{background:#D9CCFF;box-shadow:0 0 0 5px #D9CCFF}
.w{border-radius:8px;cursor:pointer;transition:background .15s,color .15s}
.w.speak{background:var(--sun);box-shadow:0 0 0 3px var(--sun)}
.w.read{color:var(--mint-d);text-decoration:underline;text-decoration-thickness:3px;text-decoration-color:rgba(46,158,110,.45);text-underline-offset:6px}
.syl .sa,.bigword .sa{color:var(--syl-a)}
.syl .sb,.bigword .sb{color:var(--syl-b)}
.bottomnav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:12px;justify-content:center;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(rgba(255,248,239,0),var(--bg) 40%);z-index:6}
.overlay{position:fixed;inset:0;background:rgba(30,25,40,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal{background:#fff;border-radius:26px;padding:26px;max-width:560px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:86vh;overflow:auto}
.modal.wide{max-width:760px;text-align:left}
.bigword{font-size:58px;font-weight:700;margin:8px 0 6px;letter-spacing:.04em;line-height:1.3}
.bigword .dot{color:#C9C2B6;margin:0 8px}
.result{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.result .n{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:40px;display:block;line-height:1.1}
.result .l{color:var(--muted);font-size:15px}
.quiz-q{font-size:28px;font-weight:700;margin:10px 0 18px;line-height:1.4}
.answers{display:grid;gap:12px}
.ans{border:3px solid var(--line);background:#fff;border-radius:18px;padding:16px 18px;font-size:24px;text-align:left;color:var(--ink)}
.ans.ok{border-color:var(--mint-d);background:var(--mint)}
.ans.no{border-color:#E5484D;background:#FFE5E5}
.dots{display:flex;gap:8px;justify-content:center;margin-bottom:12px}
.dots span{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dots span.on{background:var(--mint-d)} .dots span.now{background:var(--coral)}
label.field{display:block;margin:12px 0;font-weight:700;font-size:17px}
.field input,.field select,.field textarea{display:block;width:100%;margin-top:6px;font-weight:400;font-size:18px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:#fffdf9}
.field textarea{min-height:160px;line-height:1.5}
.check{display:flex;gap:10px;align-items:flex-start;font-size:17px;margin:12px 0}
.check input{width:24px;height:24px;margin-top:2px;flex:none}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.qbox{border:2px dashed var(--line);border-radius:14px;padding:6px 12px;margin:10px 0}
table{width:100%;border-collapse:collapse;font-size:16px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;text-align:center;margin-bottom:12px}
.stat div{background:#FFF8EF;border-radius:14px;padding:10px}
.stat b{display:block;font-family:'Baloo 2',sans-serif;font-size:30px}
.chart{width:100%;height:auto;background:#fffdf9;border-radius:14px;margin-top:8px}
ul.tips{margin:6px 0 0;padding-left:22px;line-height:1.6;font-size:17px}
#toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;font-size:18px;z-index:40;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#confetti{pointer-events:none;position:fixed;inset:0;z-index:30;overflow:hidden}
#confetti span{position:absolute;top:-50px;animation:fall 1.9s ease-in forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.tenframe{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(10px,3vw,22px);max-width:560px;margin:8px auto 18px;padding:clamp(14px,3vw,24px);border:3px solid #CBD5E1;border-radius:22px;background:#F8FAFC}
.dot{aspect-ratio:1/1;width:100%;border-radius:50%;border:0;background:#E2E6EB;padding:0;transition:background .15s,transform .1s;min-width:40px}
.dot.on{background:#D94C45}
.dot:active{transform:scale(.92)}
.dot.hint{outline:4px dashed var(--coral);outline-offset:4px}
.bignum{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:96px;line-height:1;margin:4px 0 8px}
.mmsg{min-height:32px;font-size:21px;font-weight:700;margin:0 0 14px;line-height:1.4}
/* Klassenwahl und Übungen */
.klasse{display:flex;gap:10px;margin:0 0 18px;flex-wrap:wrap}
.kchip{border:0;border-radius:999px;padding:10px 22px;font-size:19px;font-weight:700;background:#fff;box-shadow:var(--shadow);color:var(--ink);min-height:50px}
.kchip.active{background:var(--ink);color:#fff}
.xq{font-size:26px;font-weight:700;line-height:1.4;margin:6px 0 12px}
.xq .btn.small{vertical-align:middle;margin-left:6px}
.xvis{margin:4px 0 14px}
.calc{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:52px;display:block;margin:6px 0;line-height:1.2}
.qbox2{display:inline-block;border:3px dashed #CBD5E1;border-radius:12px;min-width:64px;color:#9AA3AE}
.story{font-size:24px;font-weight:400;line-height:1.55;text-align:left;max-width:640px;margin:0 auto;background:#FFF8EF;border-radius:16px;padding:14px 18px}
.wbig{font-family:'Andika',sans-serif;font-size:44px;font-weight:700;letter-spacing:.05em;margin:6px 0 8px}
.emo-big{font-size:96px;line-height:1.1;display:inline-block}
.emorow{font-size:46px;line-height:1.35;letter-spacing:6px}
.xopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;max-width:680px;margin:0 auto 14px}
.xopts.nums{grid-template-columns:repeat(auto-fit,minmax(110px,1fr));max-width:560px}
.xopts.pics{grid-template-columns:repeat(2,1fr);max-width:480px}
.xopts.wide{grid-template-columns:1fr;max-width:620px}
.xopts.wide .xopt{font-size:22px;text-align:left;padding:14px 18px}
.xopt{border:3px solid var(--line);background:#fff;border-radius:18px;padding:12px;font-size:26px;font-weight:700;color:var(--ink);min-height:74px;line-height:1.25;transition:transform .1s}
.xopt:active{transform:scale(.97)}
.xopt.sel{border-color:var(--coral);background:#FFF0EA}
.xopt.ok{border-color:var(--mint-d);background:var(--mint)}
.xopt.gone{opacity:.2;pointer-events:none}
.xopt .emo{font-size:60px;display:block;line-height:1.15}
.numdisp{display:inline-flex;min-width:170px;justify-content:center;align-items:baseline;gap:8px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:56px;border:3px solid #CBD5E1;border-radius:18px;padding:2px 22px;background:#F8FAFC;margin-bottom:12px;min-height:84px}
.numdisp small{font-size:26px;color:var(--muted)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:330px;margin:0 auto 14px}
.key{border:0;border-radius:16px;background:#fff;box-shadow:var(--shadow);font-size:30px;font-weight:700;min-height:64px;color:var(--ink)}
.key:active{transform:scale(.95)}
.slots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:4px 0 16px;min-height:66px}
.slot{width:54px;height:64px;border-radius:12px;border:3px dashed #CBD5E1;font-size:34px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;background:#fff;color:var(--ink);padding:0}
.slot.full{border-style:solid;border-color:var(--coral)}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:14px;min-height:64px}
.tile{width:58px;height:64px;border-radius:14px;border:0;background:#FFE9B8;box-shadow:var(--shadow);font-size:32px;font-weight:700;color:var(--ink)}
.minis{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.mini{display:grid;grid-template-columns:repeat(5,26px);gap:6px;padding:8px;border:2px solid #CBD5E1;border-radius:12px;background:#F8FAFC}
.md{width:26px;height:26px;border-radius:50%;background:#E2E6EB;position:relative;display:block}
.md.r{background:#D94C45} .md.b{background:#3B82F6}
.md.x{background:#F2B8B5}
.md.x::after{content:'✕';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#B42318;font-weight:700;font-size:16px}
.nline{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.nline span{min-width:44px;padding:8px 6px;border-radius:10px;background:#fff;border:2px solid var(--line);font-weight:700;font-size:20px}
.nline span.q{background:var(--sun)}
.sw{display:inline-block;width:64px;height:64px;border-radius:50%;border:3px solid rgba(0,0,0,.15)}
.sw.big{width:110px;height:110px}
.clock{width:min(250px,68vw);height:auto}
.stw{border-collapse:collapse;margin:8px auto;font-size:22px;width:auto}
.stw td,.stw th{border:2px solid #CBD5E1;padding:6px 16px;text-align:center}
@media (max-width:640px){
  .tabs{grid-template-columns:repeat(2,1fr)}
  h1{font-size:28px}
  .bigword{font-size:42px}
  .btn.big{font-size:22px;padding:14px 22px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="topbar">
  <button class="brand" data-act="home">🎒 Lern-App</button>
  <span class="stars-total" id="starsTotal">⭐ 0</span>
</header>
<main id="app"></main>
<div id="overlay" class="overlay hidden"></div>
<div id="toast"></div>
<div id="confetti"></div>

<script>
'use strict';

/* =========================================================
   INHALTE: Themen und Lesetexte (3 Stufen je Thema)
   Fragenformat: [Frage, richtige Antwort, falsch, falsch]
   ========================================================= */
const THEMES = [
  {id:'pferde',    name:'Pferde',         emo:'🐴', c:'#FFE3D3'},
  {id:'tanzen',    name:'Tanzen',         emo:'💃', c:'#FFE0EF'},
  {id:'musik',     name:'Musik',          emo:'🎵', c:'#E6E1FF'},
  {id:'fahrrad',   name:'Fahrrad fahren', emo:'🚲', c:'#DDF1FF'},
  {id:'eis',       name:'Eis essen',      emo:'🍦', c:'#FFF3C9'},
  {id:'schwimmen', name:'Schwimmen',      emo:'🏊', c:'#D5F5EE'}
];
const LEVELS = {1:'🌱 Stufe 1', 2:'🌿 Stufe 2', 3:'🌳 Stufe 3'};

const TEXTS = [
/* ---------- Pferde ---------- */
{id:'pf1',theme:'pferde',level:1,title:'Lotte und das Pony',
text:`Lotte geht jeden Mittwoch zum Reiterhof. Dort wohnt das Pony Flocke. Flocke ist klein und braun und hat eine weiße Mähne. Lotte bringt immer eine Möhre mit. Das Pony frisst sie ganz schnell und schnaubt zufrieden. Dann holt Lotte die Bürste und putzt das Fell. Flocke steht ganz still. Danach kratzt Lotte die Hufe aus. Zum Schluss darf sie eine Runde auf dem Platz reiten. Sie hält sich gut fest und lacht. Das ist der beste Tag der Woche.`,
q:[['Wie heißt das Pony?','Flocke','Wolke','Fleck'],
   ['Was bringt Lotte immer mit?','Eine Möhre','Einen Apfel','Ein Brot'],
   ['Was macht Lotte nach dem Bürsten?','Sie kratzt die Hufe aus','Sie füttert die Hühner','Sie fegt den Stall']]},
{id:'pf2',theme:'pferde',level:2,title:'Der erste Ausritt',
text:`Am Samstag ist es endlich so weit: Lotte und ihre Freundin Mia dürfen zum ersten Mal ausreiten. Schon beim Frühstück ist Lotte ganz aufgeregt. Sie bekommt kaum einen Bissen herunter.

Auf dem Reiterhof putzen die beiden Mädchen ihre Ponys besonders gründlich. Lotte reitet Flocke, Mia bekommt das graue Pony Wolke. Die Reitlehrerin Frau Berger prüft, ob die Sättel richtig sitzen und ob die Helme fest geschlossen sind. Dann reitet sie auf ihrem großen Pferd Max voraus.

Der Weg führt zuerst über eine Wiese voller Butterblumen. Die Ponys gehen ruhig im Schritt hintereinander. Dann geht es in den Wald. Hier ist es kühl und still, nur ein Specht klopft irgendwo an einen Baum.

Plötzlich raschelt es laut im Gebüsch. Flocke bleibt stehen und spitzt die Ohren. Lotte erschrickt, doch sie erinnert sich an das, was Frau Berger ihr beigebracht hat: ruhig bleiben, tief atmen und das Pony beruhigen. Sie streichelt Flocke sanft am Hals und spricht leise mit ihr. Da hüpft ein kleiner Hase aus dem Busch und rennt davon. Alle müssen lachen, sogar Frau Berger.

Auf dem Rückweg dürfen die Ponys ein Stück traben. Lotte wird ordentlich durchgeschüttelt, aber sie bleibt sicher im Sattel. Zurück im Stall bekommen Flocke und Wolke frisches Heu und eine Extramöhre. Lotte findet: Das war der schönste Tag der ganzen Woche. Auf dem Heimweg erzählt sie Mama jede Einzelheit, vom Specht bis zum Hasen. Mama hört geduldig zu. Am Abend schläft Lotte sofort ein und träumt von Flocke und dem nächsten Ausritt.`,
q:[['Wie heißt Mias Pony?','Wolke','Flocke','Max'],
   ['Was prüft Frau Berger vor dem Ausritt?','Ob Sättel und Helme richtig sitzen','Ob die Hufe sauber sind','Ob die Sonne scheint'],
   ['Was macht Lotte, als Flocke stehen bleibt?','Sie streichelt Flocke und spricht leise mit ihr','Sie springt ab','Sie ruft laut um Hilfe'],
   ['Was bekommen die Ponys zurück im Stall?','Heu und eine Extramöhre','Zucker','Gar nichts']]},
{id:'pf3',theme:'pferde',level:3,title:'Ein Fohlen kommt zur Welt',
text:`Auf dem Reiterhof gibt es große Neuigkeiten: Die Stute Luna bekommt bald ein Fohlen. Lotte kann an nichts anderes mehr denken. Jeden Tag nach der Schule fährt sie mit dem Fahrrad zum Hof und schaut nach, ob es schon so weit ist. Lunas Bauch wird immer dicker, und sie bewegt sich langsamer als früher.

Herr Kaya, der Besitzer des Hofes, erklärt Lotte, dass ein Pferd fast ein ganzes Jahr lang trächtig ist. „Die meisten Fohlen kommen nachts zur Welt“, sagt er. „Dann ist es im Stall ruhig, und die Stute fühlt sich sicher.“ Lotte ist enttäuscht. Nachts darf sie bestimmt nicht im Stall bleiben.

Eines Morgens klingelt bei Lotte zu Hause das Telefon. Es ist Herr Kaya. In der Nacht ist das Fohlen geboren! Lotte zieht sich so schnell an wie noch nie und rennt mit ihrer Mutter zum Reiterhof.

Im Stall ist es warm und riecht nach frischem Stroh. Lotte schaut vorsichtig über die Tür der Box. Im Stroh liegt ein kleines, schwarzes Pferd mit einem weißen Fleck auf der Stirn. Luna steht daneben und leckt es sauber. Das Fohlen hat lange, dünne Beine, die viel zu groß für seinen kleinen Körper aussehen.

Dann versucht das Fohlen aufzustehen. Erst rutschen die Vorderbeine weg, dann knicken die Hinterbeine ein. Lotte hält die Luft an. Beim dritten Versuch klappt es endlich. Wackelig steht das Fohlen da und läuft zu seiner Mutter, um Milch zu trinken. Herr Kaya erklärt, dass ein Fohlen schon nach ungefähr einer Stunde stehen kann. In der Natur ist das wichtig, damit es mit der Herde mitlaufen kann.

Nach einer Weile fragt Herr Kaya: „Lotte, möchtest du dem Fohlen einen Namen geben?“ Lotte strahlt. Sie überlegt lange und schaut sich das Fohlen genau an. Dann sagt sie: „Ich nenne es Stern, wegen des weißen Flecks auf der Stirn.“ Herr Kaya nickt. „Ein schöner Name. Und weil du ihn ausgesucht hast, darfst du Stern ab jetzt jede Woche besuchen.“

Auf dem Heimweg ist Lotte ganz still. Sie denkt daran, wie das Fohlen zum ersten Mal gestanden hat. Zu Hause malt sie ein Bild von Stern und Luna und hängt es über ihr Bett. So kann sie die beiden jeden Abend sehen, bevor sie einschläft.`,

/* ---------- Tanzen ---------- */
{id:'ta1',theme:'tanzen',level:1,title:'Ballett am Montag',
text:`Emma tanzt sehr gern. Jeden Montag geht sie zum Ballett. Dort zieht sie ein rosa Kleid und weiße Schläppchen an. Die Lehrerin heißt Frau Lind. Sie spielt ruhige Musik auf dem Klavier. Alle Kinder stellen sich in eine Reihe. Sie heben die Arme hoch und stellen sich auf die Zehenspitzen. Dann drehen sie sich langsam im Kreis. Emma wird ein bisschen schwindelig, doch sie hält das Gleichgewicht. Frau Lind klatscht und ruft: „Super, Emma!“`,
q:[['Wann geht Emma zum Ballett?','Am Montag','Am Freitag','Am Sonntag'],
   ['Welche Farbe hat Emmas Kleid?','Rosa','Blau','Gelb'],
   ['Worauf spielt Frau Lind die Musik?','Auf dem Klavier','Auf der Gitarre','Auf der Trommel']]},
{id:'ta2',theme:'tanzen',level:2,title:'Ein Tanz für Oma',
text:`Oma Inge hat in zwei Wochen Geburtstag. Sie wird siebzig Jahre alt, und die ganze Familie kommt zum Feiern. Emma überlegt lange, was sie ihrer Oma schenken könnte. Ein Bild hat sie ihr schon letztes Jahr gemalt. Einen Kuchen backt Mama. Dann hat Emma eine Idee: Sie denkt sich einen eigenen Tanz aus!

Zuerst sucht Emma das passende Lied. Sie weiß, dass Oma ein altes Lied über den Sommer besonders gern hört. Papa hilft ihr, das Lied zu finden. Jeden Nachmittag nach den Hausaufgaben übt Emma im Wohnzimmer. Sie schiebt den Couchtisch zur Seite, damit sie genug Platz hat. Sie überlegt sich Drehungen, Sprünge und eine Verbeugung am Ende.

Ihr kleiner Bruder Paul schaut jeden Tag zu. Er möchte unbedingt mitmachen. Erst ist Emma genervt, denn Paul ist erst vier und stolpert dauernd über seine eigenen Füße. Doch dann hat sie eine Idee: Paul darf am Ende mit einer Rassel den Takt schlagen. Paul ist begeistert und übt mit genauso viel Eifer wie seine Schwester.

Am Geburtstag sitzen alle Gäste im Garten. Emma und Paul stellen sich vor die Familie. Papa drückt auf den Knopf, und die Musik beginnt. Emma tanzt, dreht sich und springt. Am Ende rasselt Paul so laut er kann, und beide verbeugen sich. Oma Inge bekommt Tränen in den Augen, so sehr freut sie sich. „Das ist das schönste Geschenk, das ich je bekommen habe“, sagt sie und nimmt beide fest in den Arm. Den ganzen Abend summt Oma das Sommerlied vor sich hin. Und Paul trägt seine Rassel bis zum Schlafengehen mit sich herum.`,
q:[['Wie alt wird Oma Inge?','Siebzig Jahre','Sechzig Jahre','Achtzig Jahre'],
   ['Warum schiebt Emma den Couchtisch zur Seite?','Damit sie genug Platz hat','Weil er kaputt ist','Damit Paul schlafen kann'],
   ['Was darf Paul beim Tanz machen?','Mit einer Rassel den Takt schlagen','Ein Lied singen','Klavier spielen'],
   ['Warum hat Oma Tränen in den Augen?','Sie freut sich sehr','Sie ist traurig','Sie hat sich wehgetan']]},
{id:'ta3',theme:'tanzen',level:3,title:'Der große Auftritt',
text:`In drei Wochen ist die große Aufführung der Tanzschule. Alle Gruppen zeigen, was sie im letzten Jahr gelernt haben. Emmas Gruppe tanzt zu einem Lied über den Frühling. Die Kinder sind Blumen, die langsam aus der Erde wachsen und ihre Blüten öffnen. Dafür bekommen sie grüne Kostüme mit bunten Blütenblättern aus Stoff.

Emma hat eine besondere Aufgabe. Sie ist die Sonne und tanzt ganz allein in der Mitte. Wenn sie sich dreht, sollen die Blumen um sie herum wachsen. Am Anfang freut sich Emma riesig. Doch dann bekommt sie Angst. Was ist, wenn sie die Schritte vergisst? Alle Zuschauer würden es sehen.

Nach der Probe erzählt sie ihrer Lehrerin Frau Lind davon. Frau Lind lächelt und sagt: „Das geht allen Tänzerinnen so, sogar den berühmten. Ich verrate dir einen Trick. Wenn du nicht weiterweißt, atme tief ein und lächle. Dann fällt dir der nächste Schritt meistens wieder ein. Und wenn nicht, tanzt du einfach etwas Schönes, bis die Musik dich wieder abholt.“

Zu Hause übt Emma jeden Tag. Sie tanzt vor dem Spiegel, im Garten und sogar im Kopf, wenn sie abends im Bett liegt. Ihr Bruder Paul ist ihr bester Zuschauer und klatscht nach jedem Durchgang.

Am Abend der Aufführung ist der Saal voll bis auf den letzten Platz. Hinter dem Vorhang klopft Emmas Herz so laut, dass sie glaubt, alle könnten es hören. Dann geht das Licht an, und die Musik beginnt. Die ersten Schritte klappen gut. Doch bei der großen Drehung in der Mitte stockt Emma plötzlich. Für einen Moment ist ihr Kopf ganz leer.

Da denkt sie an den Trick. Sie atmet tief ein und lächelt. Und tatsächlich: Ihre Füße wissen wieder, was zu tun ist. Emma tanzt weiter, als wäre nichts gewesen. Am Ende verbeugen sich alle Kinder, und die Zuschauer klatschen begeistert. In der ersten Reihe winkt Paul mit beiden Armen.

Nach der Aufführung kommt Frau Lind zu Emma und umarmt sie. „Ich habe gesehen, dass du kurz gestockt hast“, sagt sie. „Aber du hast den Trick benutzt, und niemand im Publikum hat etwas gemerkt. Genau so machen es echte Tänzerinnen.“ Emma ist so stolz wie noch nie.`,

   ['Was tanzt Emma?','Die Sonne','Eine Blume','Den Regen'],

/* ---------- Musik ---------- */
{id:'mu1',theme:'musik',level:1,title:'Ben und die Trommel',
text:`Ben hat zum Geburtstag eine Trommel bekommen. Sie ist rot und sehr laut. Ben trommelt am Morgen vor dem Frühstück. Er trommelt am Mittag nach der Schule. Er trommelt sogar am Abend vor dem Schlafengehen. Mama hält sich die Ohren zu. „Ben, bitte etwas leiser!“, ruft sie. Ben überlegt. Dann trommelt er ganz sanft mit den Fingerspitzen. Das klingt wie Regen auf dem Dach. Mama lächelt und setzt sich zu ihm.`,
q:[['Welche Farbe hat die Trommel?','Rot','Grün','Schwarz'],
   ['Was ruft Mama?','Bitte etwas leiser!','Lauter!','Essen ist fertig!'],
   ['Wie klingt das sanfte Trommeln?','Wie Regen auf dem Dach','Wie Donner','Wie ein bellender Hund']]},
{id:'mu2',theme:'musik',level:2,title:'Die Schulband',
text:`In Bens Schule gibt es seit diesem Jahr eine Band. Herr Wolf, der Musiklehrer, hängt einen Zettel ans schwarze Brett: Kinder gesucht, die Lust auf Musik haben! Ben trägt sich sofort ein. Natürlich möchte er Schlagzeug spielen. Seine Freundin Ayla spielt schon seit zwei Jahren Gitarre, und Jonas aus der vierten Klasse singt gern. Dazu kommt noch Mira, die Keyboard spielt.

Die erste Probe findet am Donnerstag im Musikraum statt. Herr Wolf hat ein Lied ausgesucht, das alle kennen. Jeder bekommt seine Noten, und dann geht es los. Doch es klingt fürchterlich. Ben trommelt viel zu schnell, Ayla spielt zu langsam, und Jonas fängt mitten im Lied an zu singen. Alle reden durcheinander, und Mira hält sich die Ohren zu.

Herr Wolf hebt die Hand, bis es still ist. Dann erklärt er: „In einer Band ist das Wichtigste nicht, dass jeder laut spielt. Ihr müsst aufeinander hören. Der Schlagzeuger gibt den Takt vor, und alle anderen richten sich danach.“ Ben fühlt sich plötzlich sehr wichtig.

Beim nächsten Versuch zählt Ben laut vor: „Eins, zwei, drei, vier!“ Jetzt fangen alle gleichzeitig an. Es klingt schon viel besser. Nach jeder Probe wird die Band ein bisschen sicherer. Jonas lernt den Text auswendig, und Ayla übt zu Hause die schwierigen Griffe.

Nach acht Wochen ist es so weit: Beim Schulfest dürfen sie auf der Bühne im Schulhof spielen. Die ganze Schule hört zu. Als das letzte Lied vorbei ist, jubeln alle, und Herr Wolf zeigt ihnen den Daumen nach oben.`,
q:[['Welches Instrument spielt Ayla?','Gitarre','Keyboard','Flöte'],
   ['Warum klingt es bei der ersten Probe fürchterlich?','Jeder spielt in seinem eigenen Tempo','Die Gitarre ist kaputt','Jonas ist krank'],
   ['Wer gibt in einer Band den Takt vor?','Der Schlagzeuger','Die Sängerin','Der Hausmeister'],
   ['Wo spielt die Band am Ende?','Beim Schulfest im Schulhof','Im Zoo','Im Radio']]},
{id:'mu3',theme:'musik',level:3,title:'Wie entsteht ein Ton?',
text:`Hast du dich schon einmal gefragt, wie ein Ton entsteht? Ob Trommel, Gitarre oder deine eigene Stimme: Jeder Ton entsteht durch Schwingungen. Eine Schwingung ist eine sehr schnelle Bewegung hin und her.

Wenn Ben auf seine Trommel schlägt, bewegt sich das gespannte Fell ganz schnell auf und ab. Das kann man kaum sehen, aber man kann es ausprobieren: Streu ein paar Reiskörner auf die Trommel und schlag dann leicht darauf. Die Körner hüpfen herum, weil das Fell schwingt. Diese Bewegung schubst die Luft daneben an. Die Luft schubst wieder die Luft daneben an, und so wandert die Schwingung weiter, bis sie unsere Ohren erreicht. Das nennt man Schall.

In unserem Ohr kommt der Schall am Trommelfell an. Das ist eine dünne Haut, die so ähnlich funktioniert wie das Fell einer Trommel. Sie beginnt ebenfalls zu schwingen. Diese Schwingung wird weitergeleitet, bis unser Gehirn daraus einen Ton macht.

Töne können hoch oder tief sein. Das hängt davon ab, wie schnell etwas schwingt. Bei einer Gitarre schwingen die Saiten. Dünne, straff gespannte Saiten schwingen schnell und klingen hoch. Dicke, lockere Saiten schwingen langsamer und klingen tief. Deshalb dreht Ayla an den Wirbeln ihrer Gitarre, wenn sie das Instrument stimmt. So macht sie die Saiten fester oder lockerer.

Du kannst das selbst ausprobieren: Spanne ein Gummiband über eine leere Dose und zupfe daran. Wenn du das Band stärker dehnst, wird der Ton höher. Wenn du es lockerer lässt, wird er tiefer.

Auch deine Stimme funktioniert mit Schwingungen. In deinem Hals sitzen die Stimmbänder. Wenn du sprichst oder singst, strömt Luft aus der Lunge an ihnen vorbei, und sie beginnen zu schwingen. Leg einen Finger vorne an deinen Hals und summe ein Lied. Spürst du das Kribbeln? Das sind deine Stimmbänder bei der Arbeit!

Übrigens: Im Weltall gibt es keine Luft. Deshalb kann sich dort auch kein Schall ausbreiten. Selbst eine riesige Explosion wäre im Weltall völlig lautlos.

Wenn du das nächste Mal Musik hörst, denk daran: Alles, was du hörst, sind winzige Bewegungen der Luft. Eine Geige, ein Klavier, ein bellender Hund und sogar dein eigenes Lachen schwingen, bis die Schwingung bei deinem Ohr ankommt.`,
q:[['Wodurch entsteht ein Ton?','Durch Schwingungen','Durch Licht','Durch Wärme'],

/* ---------- Fahrrad ---------- */
{id:'fa1',theme:'fahrrad',level:1,title:'Ohne Stützräder',
text:`Finn hat ein blaues Fahrrad mit einer gelben Klingel. Heute schraubt Papa die Stützräder ab. Finn ist ein bisschen nervös. Er setzt seinen Helm auf und steigt auf den Sattel. Papa hält das Fahrrad hinten am Gepäckträger fest. Finn tritt kräftig in die Pedale. Er fährt schneller und schneller. Da ruft Papa von weit hinten: „Ich habe schon lange losgelassen!“ Finn fährt ganz allein. Er klingelt vor Freude. Er ist sehr stolz auf sich.`,
q:[['Welche Farbe hat Finns Fahrrad?','Blau','Rot','Grün'],
   ['Was schraubt Papa ab?','Die Stützräder','Die Klingel','Das Licht'],
   ['Was macht Finn vor Freude?','Er klingelt','Er singt','Er steigt ab']]},
{id:'fa2',theme:'fahrrad',level:2,title:'Die Fahrradtour',
text:`Am Sonntag scheint die Sonne, und Finns Familie macht eine Fahrradtour zum Silbersee. Der See liegt zwölf Kilometer entfernt. So weit ist Finn noch nie gefahren.

Vor der Abfahrt prüft Papa alle Fahrräder. Er drückt auf die Reifen, um zu fühlen, ob genug Luft darin ist. Bei Finns Hinterrad pumpt er noch etwas nach. Dann testet er die Bremsen und die Klingeln. Mama packt Brote, Äpfel, Gurken und zwei große Flaschen Wasser in die Satteltasche. Finns kleine Schwester Lina fährt im Kindersitz bei Mama mit.

Zuerst geht es auf einem breiten Radweg an Feldern entlang. Finn fährt vorne und fühlt sich wie ein echter Radrennfahrer. Doch dann kommt ein langer Hügel. Finn muss kräftig strampeln, und seine Beine fangen an zu brennen. Er schaltet in einen leichteren Gang, so wie Papa es ihm gezeigt hat. Oben angekommen, ist er ganz aus der Puste. Aber dann geht es bergab, und der Wind saust ihm um die Ohren. Finn jubelt laut.

Am See breiten sie eine Decke im Gras aus und machen Picknick. Eine Gruppe Enten watschelt neugierig heran. Lina möchte ihnen ein Stück Brot geben. Doch Mama erklärt, dass Brot für Enten ungesund ist. Es macht sie krank und verschmutzt das Wasser. Also schauen sie den Enten nur zu.

Am Nachmittag springen alle noch kurz ins kühle Wasser. Erst am Abend kommen sie müde, aber glücklich nach Hause. Finn ist vierundzwanzig Kilometer gefahren, hin und zurück. Das erzählt er am Montag gleich seiner ganzen Klasse.`,
q:[['Wie weit ist der Silbersee entfernt?','Zwölf Kilometer','Zwei Kilometer','Hundert Kilometer'],
   ['Was macht Finn am langen Hügel?','Er schaltet in einen leichteren Gang','Er steigt ab und schiebt','Er dreht um'],
   ['Warum bekommen die Enten kein Brot?','Es macht sie krank und verschmutzt das Wasser','Sie sind schon satt','Das Brot ist alle'],

{id:'fa3',theme:'fahrrad',level:3,title:'Sicher im Straßenverkehr',
text:`In der vierten Klasse machen viele Kinder die Fahrradprüfung. Finn ist zwar erst in der dritten Klasse, aber er übt jetzt schon dafür. Sein großer Cousin Jonas hat die Prüfung letztes Jahr bestanden und hilft ihm.

Zuerst lernt Finn, wie ein verkehrssicheres Fahrrad aussieht. Gemeinsam mit Jonas geht er alle Teile durch. Ein Fahrrad braucht zwei Bremsen, die unabhängig voneinander funktionieren. Wenn eine kaputtgeht, kann man mit der anderen immer noch anhalten. Außerdem braucht es eine helle Klingel, ein weißes Licht vorne und ein rotes Licht hinten. Dazu kommen Reflektoren: gelbe an den Pedalen und in den Speichen, ein weißer vorne und ein roter hinten. Reflektoren leuchten nicht selbst. Sie werfen das Licht von Autoscheinwerfern zurück, damit man das Fahrrad im Dunkeln besser sieht.

Dann geht es um den Helm. Jonas zeigt Finn, wie er richtig sitzt: Er muss die Stirn bedecken und darf nicht wackeln. Zwischen Kinn und Riemen soll gerade noch ein Finger passen.

Am wichtigsten ist das richtige Abbiegen. Bevor Finn nach links abbiegt, muss er über die linke Schulter nach hinten schauen. So sieht er, ob ein Auto kommt. Danach streckt er den linken Arm aus, damit alle wissen, wohin er will. Dann schaut er noch einmal über die Schulter. Erst wenn die Straße frei ist, biegt er in einem großen Bogen ab.

Das Armausstrecken findet Finn am schwierigsten. Mit nur einer Hand am Lenker wackelt das Fahrrad, und einmal fährt er beinahe in eine Hecke. Doch Jonas bleibt geduldig. Jeden Tag üben sie auf dem leeren Parkplatz hinter dem Supermarkt. Nach zwei Wochen fährt Finn sicher mit einer Hand geradeaus.

Im Sommer darf Finn auf dem Übungsplatz der Polizei eine Proberunde fahren. Ein freundlicher Polizist beobachtet ihn genau. Finn schaut über die Schulter, gibt Handzeichen und hält an jedem Stoppschild. Am Ende sagt der Polizist: „Kein einziger Fehler. Du bist bereit für die echte Prüfung.“ Finn strahlt bis über beide Ohren.

Am Abend erzählt Finn seinen Eltern alles. Papa schlägt vor, dass sie am Wochenende zusammen den Schulweg abfahren, damit Finn ihn genau kennenlernt. Finn ist einverstanden. Er will sich jede Kreuzung merken, damit er später allein sicher fahren kann.`,
q:[['Warum braucht ein Fahrrad zwei Bremsen?','Wenn eine kaputtgeht, kann man mit der anderen anhalten','Damit es schneller fährt','Weil es schöner aussieht'],

/* ---------- Eis essen ---------- */
{id:'ei1',theme:'eis',level:1,title:'Ein Eis für Nele',
text:`Es ist ein heißer Tag im Juli. Nele und Opa gehen zur Eisdiele am Marktplatz. Vor der Theke überlegt Nele lange. Dann nimmt sie eine Kugel Erdbeere und eine Kugel Schoko. Opa nimmt wie immer Vanille. Sie setzen sich auf eine Bank im Schatten. Doch das Eis schmilzt trotzdem sehr schnell. Ein dicker Tropfen läuft über Neles Hand. Sie leckt ihn ab und kichert. Opa lacht und gibt ihr ein Taschentuch.`,
q:[['Mit wem geht Nele zur Eisdiele?','Mit Opa','Mit Mama','Mit ihrer Freundin'],
   ['Welche Sorte nimmt Opa?','Vanille','Erdbeere','Zitrone'],
   ['Wo setzen sich die beiden hin?','Auf eine Bank im Schatten','Auf eine Mauer in der Sonne','Ins Gras']]},
{id:'ei2',theme:'eis',level:2,title:'Die Überraschungssorte',
text:`In Neles Lieblingseisdiele gibt es jeden Monat eine neue Eissorte. Im Mai gab es Rhabarber, im Juni Holunder. Nele hat alle probiert. Heute steht auf der großen Tafel neben der Tür nur ein einziges Wort: „Überraschung!“

Hinter der Theke steht Luigi, der Besitzer der Eisdiele. Er hat einen dicken Schnurrbart und lacht immer laut. Als Nele fragt, was die neue Sorte ist, legt er einen Finger auf die Lippen. „Das verrate ich nicht“, sagt er. „Aber wer es errät, bekommt eine Extrakugel geschenkt.“

Nele ist neugierig. Sie darf einen kleinen Probierlöffel nehmen. Das Eis ist hellgrün und hat kleine Stückchen darin. Es schmeckt süß, cremig und ein bisschen nach Nuss.

Nele überlegt. Grün ist ja auch Minze. „Ist es Minze?“, fragt sie. Luigi schüttelt den Kopf. „Nein, Minze schmeckt frisch und kühl im Mund.“ Nele probiert noch einmal. „Ist es Apfel?“ Wieder schüttelt Luigi den Kopf. Inzwischen warten schon andere Kinder hinter ihr und rufen eigene Ideen: Kiwi, Waldmeister, Gurke! Alle lachen über die Gurke.

Nele schließt die Augen und achtet nur auf den Geschmack. Da fällt ihr ein, dass Papa manchmal kleine grüne Nüsse aus einer Schale knackt. Die haben genau so geschmeckt. „Pistazie!“, ruft Nele laut.

Luigi lacht so sehr, dass sein Schnurrbart wackelt. Er nickt und klatscht in die Hände. Als Belohnung bekommt Nele eine Extrakugel geschenkt. Sie nimmt natürlich Pistazie. Während sie das Eis schleckt, überlegt sie schon, was wohl im nächsten Monat auf der Tafel stehen wird. Vielleicht Kürbis? Oder sogar Zimt? Sie wird es bestimmt wieder herausfinden.`,
q:[['Welche Sorte gab es im Juni?','Holunder','Rhabarber','Kirsche'],
   ['Was bekommt, wer die Sorte errät?','Eine Extrakugel','Einen Luftballon','Ein Bild'],
   ['Wie schmeckt das Überraschungseis?','Süß, cremig und ein bisschen nach Nuss','Sauer wie Zitrone','Scharf wie Pfeffer'],
   ['Woran erinnert sich Nele?','An Nüsse, die Papa knackt','An Omas Kuchen','An den letzten Urlaub']]},
{id:'ei3',theme:'eis',level:3,title:'Wie wird Eis gemacht?',
text:`In den Sommerferien darf Nele einen ganzen Vormittag in Luigis Eisdiele verbringen. Sie will herausfinden, wie Eis gemacht wird. Luigi bindet ihr eine weiße Schürze um, und dann geht es in die Küche hinter dem Laden.

Dort steht eine große, glänzende Maschine. Luigi erklärt, dass man für Milcheis drei Grundzutaten braucht: Milch, Sahne und Zucker. Für Erdbeereis kommen frische Erdbeeren dazu. Nele darf die Erdbeeren waschen und mit einer Gabel zerdrücken. Dabei spritzt der rote Saft bis auf ihre Nase. Luigi mischt alles in einem großen Topf und gießt die Mischung dann in die Maschine.

In der Maschine passieren zwei Dinge gleichzeitig. Die Mischung wird stark gekühlt, und ein Rührarm dreht sich ständig im Kreis. Nele fragt, warum man das Eis nicht einfach in den Gefrierschrank stellt. Luigi erklärt: „Wenn Flüssigkeit gefriert, bilden sich Eiskristalle. Rührt man nicht, werden die Kristalle groß und hart. Dann ist das Eis körnig wie gefrorener Schnee. Durch das Rühren bleiben die Kristalle winzig klein, und das Eis wird weich und cremig.“ Außerdem kommt beim Rühren Luft in die Masse. Auch das macht das Eis locker.

/* =========================================================
   SILBENTRENNUNG (Näherung für deutsche Wörter)
   ========================================================= */
const C_UNITS = ['sch','ch','ck','ph','qu','th'];
const V_UNITS = ['äu','ei','ai','au','eu','ie','aa','ee','oo','a','e','i','o','u','ä','ö','ü','y'];
const ONSETS = new Set(['bl','br','dr','fl','fr','gl','gr','kl','kn','kr','pl','pr','tr','zw','schl','schm','schn','schr','schw']);
function syllabifyCore(word){
  const lw = word.toLowerCase();
  if(lw.length < 4 || /[^a-zäöüß]/.test(lw)) return [word];
  const units = []; let i = 0;
  while(i < lw.length){
    let m = null;
    for(const u of C_UNITS){ if(lw.startsWith(u, i)){ m = {u, v:false}; break; } }
    if(!m) for(const u of V_UNITS){ if(lw.startsWith(u, i)){ m = {u, v:true}; break; } }
    if(!m) m = {u:lw[i], v:false};
    units.push({u:m.u, v:m.v, start:i});
    i += m.u.length;
  }
  const vIdx = []; units.forEach((u,k) => { if(u.v) vIdx.push(k); });
  if(vIdx.length < 2) return [word];
  const cuts = [];
  for(let a=0; a<vIdx.length-1; a++){
    const v1 = vIdx[a], v2 = vIdx[a+1], n = v2 - v1 - 1;
    let cut;
    if(n <= 1) cut = v1 + 1;
    else {
      cut = v2 - 1;
      const two = units[v2-2].u + units[v2-1].u;
      if(n >= 3 && ONSETS.has(two)) cut = v2 - 2;
      if(n === 2 && units[v2-2].u === 'sch') cut = v2 - 2;
    }
    cuts.push(units[cut].start);
  }
  const parts = []; let last = 0;
  cuts.forEach(c => { if(c > last){ parts.push(word.slice(last, c)); last = c; } });
  parts.push(word.slice(last));
  return parts.filter(Boolean);
}
function syllabify(word){
  if(word.indexOf('-') === -1) return syllabifyCore(word);
  const out = []; const segs = word.split('-');
  segs.forEach((seg, i) => {
    if(!seg) return;
    const s = syllabifyCore(seg);
    if(i < segs.length-1) s[s.length-1] += '-';
    out.push(...s);
  });
  return out;
}
function sylSpans(w){ return syllabify(w).map((p,i) => `<span class="${i%2?'sb':'sa'}">${esc(p)}</span>`).join(''); }

/* =========================================================
   TEXT ZERLEGEN: Absätze → Sätze → Wörter
   ========================================================= */
const WORD_RE = /^([^\p{L}\p{N}]*)([\p{L}\p{N}](?:[\p{L}\p{N}'’-]*[\p{L}\p{N}])?)(.*)$/u;
function splitSentences(s){
  const out = []; let start = 0;
  for(let i=0; i<s.length; i++){
    if('.!?'.indexOf(s[i]) === -1) continue;
    let j = i + 1;
    while(j < s.length && '.!?“"»)'.indexOf(s[j]) !== -1) j++;
    let k = j;
    while(k < s.length && /\s/.test(s[k])) k++;
    if(k >= s.length){ out.push(s.slice(start).trim()); start = s.length; break; }
    if(k > j && /[A-ZÄÖÜ„"«0-9]/.test(s[k])){ out.push(s.slice(start, j).trim()); start = k; i = k - 1; }
  }
  if(start < s.length){ const r = s.slice(start).trim(); if(r) out.push(r); }
  return out.filter(Boolean);
}
function parseText(text){
  const paras = String(text).trim().split(/\n\s*\n/);
  const sentences = [], wordList = [], paraIdx = [];
  let gi = 0;
  paras.forEach(pt => {
    const idx = [];
    splitSentences(pt.replace(/\s+/g,' ').trim()).forEach(st => {
      const toks = []; let pos = 0;
      st.split(' ').forEach(tok => {
        if(!tok){ pos++; return; }
        const m = tok.match(WORD_RE);
        if(m && m[2]){
          toks.push({pre:m[1], w:m[2], post:m[3], gi:gi++, off:pos + m[1].length});
          wordList.push(m[2]);
        } else toks.push({plain:tok});
        pos += tok.length + 1;
      });
      idx.push(sentences.length);
      sentences.push({text:st, toks});
    });
    paraIdx.push(idx);
  });
  return {sentences, paras:paraIdx, wordList, wordCount:wordList.length};
}
function norm(s){ return String(s).toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim(); }

}

function isFocus(){ return S.settings.focus && (R.mode === 'lesen' || R.mode === 'stoppuhr'); }
function roleOf(i){
  let start = S.settings.tandemStart === 'parent' ? 1 : 0;
  if(R.swap) start = 1 - start;
  return ((i + start) % 2 === 0) ? 'child' : 'parent';
}
function setMode(m){
  stopSpeech(); R.speaking = false;
  if(R.running) stopRunInternals();
  R.mode = m; R.cur = 0; R.phase = 'idle'; R.readPtr = 0;
  $$('.tab').forEach(b => b.classList.toggle('active', b.dataset.m === m));
  renderText(); renderPanel();

}
function textHTML(P, tandem){
  return P.paras.map(idx => '<p>' + idx.map(si => {
    const s = P.sentences[si];
    const cls = 'sent' + (tandem ? (roleOf(si) === 'child' ? ' r-child' : ' r-parent') : '');
    return `<span class="${cls}" data-s="${si}">` + s.toks.map(t =>
      t.plain != null ? esc(t.plain)
        : esc(t.pre) + `<span class="w" data-w="${t.gi}">${S.settings.syl ? sylSpans(t.w) : esc(t.w)}</span>` + esc(t.post)
    ).join(' ') + '</span>';

}
function renderText(){
  const el = $('#reading'); if(!el) return;

  $('#bottomnav').classList.toggle('hidden', !((tandem && R.phase !== 'done') || isFocus()));

}
function applyCur(scroll){
  const show = R.mode === 'zusammen' || isFocus() || (R.mode === 'vorlesen' && R.speaking);
  $$('#reading .sent').forEach(s => s.classList.toggle('cur', show && +s.dataset.s === R.cur));
  for(let i=0; i<R.readPtr; i++){ const w = $(`#reading .w[data-w="${i}"]`); if(w) w.classList.add('read'); }
  if(scroll !== false && show){
    const c = $('#reading .sent.cur');
    if(c) c.scrollIntoView({block:'center', behavior:'smooth'});

}
function setCur(i){
  R.cur = clamp(i, 0, R.parsed.sentences.length - 1);
  applyCur();
  if(R.mode === 'zusammen'){ renderPanel(); maybeTabletSpeak(); }
}
function markSpokenWord(si, ci){
  const s = R.parsed.sentences[si]; if(!s) return;
  let w = null;
  s.toks.forEach(t => { if(t.plain == null && t.off <= ci) w = t; });
  clearSpoken();
  if(w){ const el = $(`#reading .w[data-w="${w.gi}"]`); if(el) el.classList.add('speak'); }
}
function clearSpoken(){ $$('#reading .w.speak').forEach(e => e.classList.remove('speak')); }

function quizBtn(){ return (R.t.q && R.t.q.length) ? `<button class="btn primary" data-act="quiz" data-id="${esc(R.id)}">❓ Fragen zum Text</button>` : ''; }

      if(SR) opts.push(['mit','👂 Tablet hört mit']);

/* ---------- Vorlesen ---------- */
function startVorlesen(){
  if(!TTS.ok) return;
  stopSpeech(); R.speaking = true; R.phase = 'idle';
  const sents = R.parsed.sentences;
  const from = R.cur >= sents.length - 1 ? 0 : R.cur;
  for(let i=from; i<sents.length; i++){
    const u = utter(sents[i].text);
    u.onstart = () => { if(!R.speaking || R.mode !== 'vorlesen') return; R.cur = i; applyCur(); };
    u.onboundary = e => { if(!R.speaking) return; if(e.name && e.name !== 'word') return; markSpokenWord(i, e.charIndex); };
    u.onend = () => {
      clearSpoken();
      if(i === sents.length - 1 && R.speaking && R.mode === 'vorlesen'){
        R.speaking = false; R.cur = 0; R.phase = 'heard'; applyCur(false); renderPanel();
      }
    };
    speechSynthesis.speak(u);
  }
  renderPanel();
}
function stopVorlesen(){ R.speaking = false; stopSpeech(); clearSpoken(); applyCur(false); renderPanel(); }

/* ---------- Zusammen lesen (Lautlese-Tandem) ---------- */
function tandemNext(){
  stopSpeech(); clearSpoken();
  if(R.cur >= R.parsed.sentences.length - 1){
    R.phase = 'done'; R.cur = -1;
    S.done[R.id] = true; save(); updateStarsTotal(); celebrate();
    applyCur(false); renderPanel();
    return;
  }
  setCur(R.cur + 1);
}
function tandemPrev(){ stopSpeech(); clearSpoken(); if(R.cur > 0) setCur(R.cur - 1); }
function maybeTabletSpeak(){
  if(R.mode !== 'zusammen' || R.phase === 'done' || !S.settings.tabletParent || !TTS.ok) return;
  if(roleOf(R.cur) !== 'parent') return;
  const i = R.cur;
  const u = utter(R.parsed.sentences[i].text);
  u.onboundary = e => { if(R.cur === i && (!e.name || e.name === 'word')) markSpokenWord(i, e.charIndex); };
  u.onend = () => {
    clearSpoken();
    if(R.mode === 'zusammen' && R.cur === i && R.phase !== 'done'){
      setTimeout(() => { if(R.mode === 'zusammen' && R.cur === i && R.phase !== 'done') tandemNext(); }, 400);
    }
  };
  stopSpeech(); speechSynthesis.speak(u);
}

/* ---------- Stoppuhr ---------- */
async function startRun(){
  R.audioURL = null; R.readPtr = 0; R.autoDone = false;
  $$('#reading .w.read').forEach(w => w.classList.remove('read'));
  if(R.opt === 'rec'){
    try{ await startRecording(); }
    catch(e){ toast('Mikrofon nicht verfügbar – wir messen nur die Zeit.'); R.opt = 'zeit'; }
  }
  if(R.opt === 'mit') startRecog();
  R.running = true; R.phase = 'running'; R.t0 = performance.now(); R.cur = 0;
  renderPanel(); applyCur();
  R.timer = setInterval(() => {
    const c = $('#clock'); if(c) c.textContent = '⏱ ' + fmt((performance.now() - R.t0) / 1000);
  }, 250);
}
function stopRunInternals(){
  clearInterval(R.timer); R.timer = null; R.running = false;
  if(R.mr && R.mr.state !== 'inactive'){ try{ R.mr.stop(); }catch(e){} }
  R.mr = null;
  if(R.recog){ const r = R.recog; R.recog = null; try{ r.stop(); }catch(e){} }
}
function finishRun(){
  if(!R.running) return;
  const sec = Math.max(1, (performance.now() - R.t0) / 1000);
  stopRunInternals();
  const words = R.parsed.wordCount;
  const wpm = Math.round(words / (sec / 60));
  const runs = S.runs[R.id] || (S.runs[R.id] = []);
  const prev = runs.length ? runs[runs.length - 1] : null;
  const best = runs.length ? Math.max.apply(null, runs.map(r => r.wpm)) : 0;
  runs.push({t:Date.now(), sec:Math.round(sec), words, wpm});
  S.done[R.id] = true; save(); updateStarsTotal();
  let msg;
  if(!prev) msg = 'Erste Runde geschafft! 💪 Lies den Text noch zweimal – du wirst merken, wie es immer leichter geht.';
  else if(wpm > best) msg = `Neuer Rekord! 🚀 ${wpm - prev.wpm > 0 ? (wpm - prev.wpm) + ' Wörter pro Minute schneller als letztes Mal.' : ''}`;
  else if(wpm > prev.wpm) msg = `Super! ${wpm - prev.wpm} Wörter pro Minute schneller als letztes Mal. 👍`;
  else if(wpm === prev.wpm) msg = 'Genauso schnell wie letztes Mal. Weiter so!';
  else msg = 'Diesmal etwas langsamer – das ist völlig okay. Genau lesen ist wichtiger als schnell lesen.';
  if(runs.length === 3) msg += ' Du hast den dritten Stern! ⭐';
  if(!prev || wpm > prev.wpm || runs.length === 3) celebrate();
  R.last = {sec, wpm, round:runs.length, msg};
  R.phase = 'done'; renderPanel();
}
function cancelRun(){ stopRunInternals(); R.phase = 'idle'; R.readPtr = 0; renderText(); renderPanel(); }

async function startRecording(){
  if(!canRecord()) throw new Error('no recorder');
  const stream = await navigator.mediaDevices.getUserMedia({audio:true});
  const types = ['audio/mp4','audio/webm;codecs=opus','audio/webm'];
  const type = types.find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t));
  const mr = type ? new MediaRecorder(stream, {mimeType:type}) : new MediaRecorder(stream);
  const chunks = [];
  mr.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
  mr.onstop = () => {
    stream.getTracks().forEach(t => t.stop());
    const blob = new Blob(chunks, {type: mr.mimeType || type || 'audio/mp4'});
    if(R.audioURL) URL.revokeObjectURL(R.audioURL);
    R.audioURL = URL.createObjectURL(blob);
    if(R.phase === 'done' && R.mode === 'stoppuhr') renderPanel();
  };
  mr.start(); R.mr = mr;
}

function lev(a, b){
  if(Math.abs(a.length - b.length) > 1) return 2;
  const d = Array.from({length:a.length+1}, (_, i) => [i]);
  for(let j=1; j<=b.length; j++) d[0][j] = j;
  for(let i=1; i<=a.length; i++) for(let j=1; j<=b.length; j++)
    d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[a.length][b.length];
}
function similar(a, b){
  if(a === b) return true;
  if(a.length > 3 && b.length > 3) return a.slice(0,4) === b.slice(0,4) || lev(a, b) <= 1;
  return false;
}
function startRecog(){
  if(!SR) return;
  const r = new SR();
  r.lang = 'de-DE'; r.continuous = true; r.interimResults = true;
  R.recog = r; R.recogBase = []; R.recogFinal = '';
  R.normWords = R.parsed.wordList.map(norm);
  r.onresult = e => {
    const finals = [], interim = [];
    for(let i=0; i<e.results.length; i++){
      const t = e.results[i][0].transcript;
      (e.results[i].isFinal ? finals : interim).push(t);
    }
    R.recogFinal = finals.join(' ');
    matchTranscript(R.recogBase.join(' ') + ' ' + R.recogFinal + ' ' + interim.join(' '));
  };
  r.onend = () => {
    if(R.running && R.recog === r){
      R.recogBase.push(R.recogFinal || ''); R.recogFinal = '';
      try{ r.start(); }catch(e){}
    }
  };
  r.onerror = e => {
    if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
      toast('Mikrofon ist nicht erlaubt – die Stoppuhr läuft trotzdem.'); R.recog = null;
    }
  };
  try{ r.start(); }catch(e){}
}
function matchTranscript(all){
  const toks = norm(all).split(' ').filter(Boolean);
  const W = R.normWords; let p = 0;
  toks.forEach(t => {
    for(let k=p; k<Math.min(p+5, W.length); k++){ if(similar(t, W[k])){ p = k + 1; break; } }
  });
  if(p > R.readPtr){
    for(let i=R.readPtr; i<p; i++){ const w = $(`#reading .w[data-w="${i}"]`); if(w) w.classList.add('read'); }
    R.readPtr = p;
    const lastW = $(`#reading .w[data-w="${p-1}"]`);
    const sent = lastW && lastW.closest('.sent');
    if(sent && +sent.dataset.s !== R.cur){ R.cur = +sent.dataset.s; applyCur(); }
  }
  if(p >= W.length && R.running && !R.autoDone){ R.autoDone = true; setTimeout(finishRun, 700); }
}

/* ---------- Silbenhilfe ---------- */
function openWord(gi){
  const w = R.parsed.wordList[gi]; if(!w) return;
  const parts = syllabify(w);
  showModal(`<div class="bigword">${parts.map((p,i) => `<span class="${i%2?'sb':'sa'}">${esc(p)}</span>`).join('<span class="dot">·</span>')}</div>
    <p class="muted" style="margin:0 0 16px">${parts.length} ${parts.length === 1 ? 'Silbe' : 'Silben'} – klatsch mit!</p>
    <div class="row center">${TTS.ok ? `<button class="btn primary" data-act="sayWord" data-w="${esc(w)}">🔊 Anhören</button>` : ''}
    <button class="btn" data-act="closeModal">Schließen</button></div>`);
  if(!R.speaking && !R.running) sayWord(w);
}

/* =========================================================
   QUIZ
   ========================================================= */
let Q = {};
function renderQuiz(id){
  const t = getText(id);
  if(!t.q || !t.q.length){ go('#/r/' + id); return; }
  Q = {id, t, i:0, right:0, answered:false, orders:t.q.map(q => shuffle(q.slice(1).map((_, k) => k + 1)))};
  drawQuiz();
}
function drawQuiz(){
  const q = Q.t.q[Q.i], n = Q.t.q.length;
  $('#app').innerHTML = `
    <button class="btn small back" data-act="read" data-id="${esc(Q.id)}">← Zum Text</button>
    <div class="panel">
      <div class="dots">${Q.t.q.map((_, k) => `<span class="${k < Q.i ? 'on' : ''}${k === Q.i ? ' now' : ''}"></span>`).join('')}</div>
      <div class="row" style="justify-content:space-between"><span class="muted">Frage ${Q.i + 1} von ${n} · ${esc(Q.t.title)}</span>

function answer(a){

];
const EX = [];

function exById(id){ return EX.find(e => e.id === id); }
function fachSichtbar(f){ return !f.nurKlasse || f.nurKlasse === klasse(); }
function exSichtbar(e){ const f = FAECHER.find(x => x.id === e.fach); return e.klasse === klasse() && fachSichtbar(f); }
function klasse(){ return +S.settings.klasse === 1 ? 1 : 3; }
function kidName(){ const n = S.settings.names || {}; return n[klasse()] || ''; }
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

function pickN(a, n, not){ return shuffle(a.filter(x => x !== not)).slice(0, n); }
function strip(h){ return String(h).replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim(); }
function exStars(id){ const r = (S.ex || {})[id]; const b = r ? r.best : 0; return b >= 10 ? 3 : b >= 8 ? 2 : b >= 5 ? 1 : 0; }
function exStarHTML(id){ const n = exStars(id); return [0,1,2].map(k => `<span class="${k < n ? '' : 'star-off'}">⭐</span>`).join(''); }
function textStarsTotal(){ return allTexts().reduce((a, t) => a + starCount(t.id), 0); }
function fachStars(f, kl){

/* ---------- Bausteine für Aufgaben ---------- */
function choiceTask(o){
  const vals = shuffle([o.right].concat(o.wrong));
  const r = o.render || (v => esc(String(v)));
  return Object.assign({type:'choice', answer:o.right, options: vals.map(v => ({v, html:r(v)}))}, o);
}
function numOpts(right, lo, hi){
  const s = new Set([right]); let g = 0;
  while(s.size < 4 && g < 200){ const v = right + rnd(-3, 3); if(v >= lo && v <= hi) s.add(v); g++; }
  for(let v = lo; s.size < 4 && v <= hi; v++) s.add(v);
  return [...s].filter(x => x !== right);
}
function emoBig(e){ return `<span class="emo-big">${e}</span>`; }

function minis(cols){

  for(let f = 0; f < frames; f++){
    h += '<div class="mini">' + Array.from({length:10}, (_, k) => `<span class="md ${cols[f*10 + k] || ''}"></span>`).join('') + '</div>';
  }

}
function nline(from, to, q){
  let h = '';
  for(let i = from; i <= to; i++) h += `<span class="${i === q ? 'q' : ''}">${i === q ? '?' : i}</span>`;
  return `<div class="nline">${h}</div>`;
}
function stw(H, Z, E){
  return `<table class="stw"><tr><th>H</th><th>Z</th><th>E</th></tr><tr><td>${H}</td><td>${Z}</td><td>${E}</td></tr></table>`;
}
function sylHTML(s){ return s.split('-').map((p, i) => `<span class="${i % 2 ? 'sb' : 'sa'}">${esc(p)}</span>`).join('<span class="dot">·</span>'); }
function clockSVG(h, m){
  const ha = ((h % 12) + m / 60) * 30, ma = m * 6;
  let nums = '', ticks = '';
  for(let i = 1; i <= 12; i++){
    const a = (i * 30 - 90) * Math.PI / 180;
    nums += `<text x="${(100 + 72*Math.cos(a)).toFixed(1)}" y="${(100 + 72*Math.sin(a) + 7).toFixed(1)}" text-anchor="middle" font-size="20" font-weight="700" fill="#2B2A33">${i}</text>`;
  }
  for(let i = 0; i < 60; i++){
    const a = (i * 6 - 90) * Math.PI / 180, r1 = i % 5 ? 89 : 84;
    ticks += `<line x1="${(100 + r1*Math.cos(a)).toFixed(1)}" y1="${(100 + r1*Math.sin(a)).toFixed(1)}" x2="${(100 + 93*Math.cos(a)).toFixed(1)}" y2="${(100 + 93*Math.sin(a)).toFixed(1)}" stroke="#2B2A33" stroke-width="${i % 5 ? 1 : 3}"/>`;
  }
  return `<svg class="clock" viewBox="0 0 200 200" role="img" aria-label="Uhr">
    <circle cx="100" cy="100" r="96" fill="#fff" stroke="#2B2A33" stroke-width="4"/>${ticks}${nums}
    <line x1="100" y1="100" x2="100" y2="56" stroke="#D94C45" stroke-width="8" stroke-linecap="round" transform="rotate(${ha} 100 100)"/>
    <line x1="100" y1="100" x2="100" y2="22" stroke="#1F6FEB" stroke-width="5" stroke-linecap="round" transform="rotate(${ma} 100 100)"/>
    <circle cx="100" cy="100" r="6" fill="#2B2A33"/></svg>`;
}

let X = {};
function startEx(id){
  const d = exById(id);
  if(d.link){ go(d.link); return; }
  X = {d, i:0, right:0, used:{}};
  loadTask();
}
function loadTask(){
  let t, g = 0;
  do { t = X.d.gen(); g++; } while(t.key != null && X.used[t.key] && g < 40);
  if(t.key != null) X.used[t.key] = true;
  X.t = t; X.tries = 0; X.helped = false; X.lock = false; X.gone = {}; X.hintFrame = false;
  X.val = t.type === 'num' ? '' : t.type === 'tiles' ? [] : t.type === 'frame' ? new Array(10).fill(false) : null;
  drawTask('');
  if(t.sayEn || (t.say && (klasse() === 1 || t.autoSay))) setTimeout(() => { if(X.t === t) speakTask(); }, 350);
}
function speakTask(){
  if(!TTS.ok) return;
  const t = X.t; stopSpeech();
  if(t.say){
    let s = t.say;
    if(t.sayOpts && t.options){
      const o = t.options.filter((_, k) => !X.gone[k]).map(x => String(x.v));
      s += ' Ist es ' + (o.length > 1 ? o.slice(0, -1).join(', ') + ' oder ' + o[o.length - 1] : o[0]) + '?';
    }
    speechSynthesis.speak(utter(s));
  }
  if(t.sayEn) speechSynthesis.speak(utterEn(t.sayEn));
}
function drawTask(msg){
  const t = X.t, d = X.d;
  const canSay = TTS.ok && (t.say || t.sayEn);
  $('#app').innerHTML = `
    <button class="btn small back" data-act="fach" data-id="${d.fach}">← Zurück zum Menü</button>
    <div class="panel center">
      <div class="dots">${Array.from({length:d.n}, (_, k) => `<span class="${k < X.i ? 'on' : ''}${k === X.i ? ' now' : ''}"></span>`).join('')}</div>
      <h2>${d.emo} ${esc(d.title)}</h2>
      <div class="xq">${t.prompt}${canSay ? ' <button class="btn small" data-act="xsay" aria-label="Vorlesen">🔊</button>' : ''}</div>
      ${t.visual ? `<div class="xvis">${t.visual}</div>` : ''}
      <div id="xin">${inputHTML()}</div>
      <div id="xmsg" class="mmsg">${msg}</div>
      <div class="row center" id="xbtns">
        <button class="btn big mint" data-act="xok">✅ OK</button>
        <button class="btn big" data-act="xhelp">💡 Hilfe</button>
      </div>
    </div>`;
}
function inputHTML(){
  const t = X.t;
  if(t.type === 'choice'){
    return `<div class="xopts${t.optClass ? ' ' + t.optClass : ''}">` + t.options.map((o, k) =>
      `<button class="xopt${X.val === k ? ' sel' : ''}${X.gone[k] ? ' gone' : ''}${X.lock && o.v === t.answer ? ' ok' : ''}" data-act="xsel" data-k="${k}">${o.html}</button>`
    ).join('') + '</div>';
  }
  if(t.type === 'num'){
    const keys = ['1','2','3','4','5','6','7','8','9','⌫','0','C'];
    return `<div class="numdisp">${X.val === '' ? '<span class="muted">?</span>' : esc(X.val)}${t.unit ? ` <small>${esc(t.unit)}</small>` : ''}</div>
      <div class="pad">${keys.map(k => `<button class="key" data-act="xkey" data-v="${k}">${k}</button>`).join('')}</div>`;
  }
  if(t.type === 'tiles'){
    const used = {}; X.val.forEach(i => { used[i] = true; });
    const slots = t.word.split('').map((_, p) => {
      const ti = X.val[p];
      return ti != null ? `<button class="slot full" data-act="xslot" data-p="${p}">${esc(t.tiles[ti])}</button>` : '<span class="slot"></span>';
    }).join('');
    const tiles = t.tiles.map((c, i) => used[i] ? '' : `<button class="tile" data-act="xtile" data-k="${i}">${esc(c)}</button>`).join('');
    return `<div class="slots">${slots}</div><div class="tiles">${tiles}</div>`;
  }
  if(t.type === 'frame'){
    return `<div class="tenframe">${X.val.map((on, k) => `<button class="dot${on ? ' on' : ''}${X.hintFrame && k < t.answer ? ' hint' : ''}" data-act="xdot" data-k="${k}" aria-label="Kreis ${k + 1}"></button>`).join('')}</div><div class="bignum">${t.answer}</div>`;
  }
  return '';
}
function refreshIn(){ const el = $('#xin'); if(el) el.innerHTML = inputHTML(); }
function setMsg(h){ const m = $('#xmsg'); if(m) m.innerHTML = h; }

function xSel(k){ if(X.lock || X.gone[k]) return; X.val = k; refreshIn(); setMsg(''); }
function xKey(v){
  if(X.lock) return;
  if(v === '⌫') X.val = X.val.slice(0, -1);
  else if(v === 'C') X.val = '';
  else if(X.val.length < (X.t.maxLen || 4)) X.val = (X.val === '0' ? '' : X.val) + v;
  refreshIn(); setMsg('');
}
function xTile(k){ if(X.lock || X.val.length >= X.t.word.length) return; X.val.push(k); refreshIn(); setMsg(''); }
function xSlot(p){ if(X.lock) return; X.val.splice(p, 1); refreshIn(); }
function xDot(k){
  if(X.lock) return;
  X.val[k] = !X.val[k];
  const el = $(`.dot[data-k="${k}"]`); if(el) el.classList.toggle('on', X.val[k]);
}
function xValue(){
  const t = X.t;
  if(t.type === 'choice') return X.val == null ? null : t.options[X.val].v;
  if(t.type === 'num') return X.val === '' ? null : +X.val;
  if(t.type === 'tiles') return X.val.length ? X.val.map(i => t.tiles[i]).join('') : null;
  if(t.type === 'frame') return X.val.filter(Boolean).length;
  return null;
}
const EMPTY_MSG = {choice:'Tippe zuerst auf eine Antwort.', num:'Tippe zuerst eine Zahl ein.', tiles:'Tippe zuerst auf die Buchstaben.', frame:'Tippe zuerst Kreise an.'};
function xSolution(){
  const t = X.t;
  if(t.type === 'choice'){ const o = t.options.find(x => x.v === t.answer); return o ? o.html : esc(t.answer); }
  if(t.type === 'tiles') return esc(t.word);
  return esc(String(t.answer)) + (t.unit ? ' ' + esc(t.unit) : '');
}
function revealInput(){
  const t = X.t;
  if(t.type === 'num') X.val = String(t.answer);
  if(t.type === 'frame') X.val = X.val.map((_, k) => k < t.answer);
  if(t.type === 'tiles'){
    const used = {}; X.val = [];
    t.word.split('').forEach(c => { const k = t.tiles.findIndex((x, i) => !used[i] && x === c); used[k] = true; X.val.push(k); });
  }
}
function toWeiter(){ $('#xbtns').innerHTML = '<button class="btn big primary" data-act="xnext">Weiter ▶</button>'; }
function afterHTML(){ return X.t.after ? `<div class="muted" style="font-weight:400;margin-top:6px">${X.t.after}</div>` : ''; }
function xOk(){
  if(X.lock) return;
  const t = X.t, v = xValue();
  if(v == null || (t.type === 'frame' && v === 0)){ setMsg(EMPTY_MSG[t.type]); return; }
  const ok = t.type === 'tiles' ? v === t.word : v === t.answer;
  if(ok){
    X.lock = true; X.hintFrame = false;
    const clean = X.tries === 0 && !X.helped;
    if(clean){ X.right++; celebrate(); }
    setMsg((clean ? pick(['Richtig! 🎉','Super! ⭐','Genau! 👍','Klasse! 🌟']) : 'Richtig! Gut gemacht. 👍') + afterHTML());
    refreshIn(); toWeiter();
    if(t.okEn) speakEn(t.okEn);
    return;
  }
  X.tries++;
  if(t.type === 'choice'){ X.gone[X.val] = true; X.val = null; }
  if(X.tries >= 3){
    X.lock = true; X.hintFrame = false;
    revealInput();
    setMsg(`Die richtige Lösung ist: <b>${xSolution()}</b>` + afterHTML());
    refreshIn(); toWeiter();
    if(t.okEn) speakEn(t.okEn);
    return;
  }
  setMsg(t.wrong ? t.wrong(v) : (t.type === 'choice' ? 'Das stimmt noch nicht. Versuch es nochmal!' : 'Das stimmt noch nicht. Schau noch einmal genau hin!'));
  refreshIn();
  const el = $('#xin'); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
}
function xHelp(){
  if(X.lock) return;
  const t = X.t; X.helped = true;
  let h = t.hint ? t.hint() : '';
  if(t.type === 'choice'){
    const wrong = t.options.map((_, k) => k).filter(k => t.options[k].v !== t.answer && !X.gone[k]);
    if(wrong.length > 1){
      const k = pick(wrong); X.gone[k] = true; if(X.val === k) X.val = null;
      h = (h ? h + '<br>' : '') + '<span class="muted" style="font-weight:400">Eine falsche Antwort ist jetzt weg.</span>';
    }
  }
  if(t.type === 'tiles'){
    const w = t.word; let p = 0;
    while(p < X.val.length && t.tiles[X.val[p]] === w[p]) p++;
    X.val = X.val.slice(0, p);
    if(p < w.length){
      const used = {}; X.val.forEach(i => { used[i] = true; });
      const k = t.tiles.findIndex((c, i) => !used[i] && c === w[p]);
      if(k >= 0) X.val.push(k);
    }
    h = (h ? h + '<br>' : '') + 'Ich habe dir den nächsten Buchstaben hingelegt.';
  }
  if(t.type === 'frame') X.hintFrame = true;
  refreshIn();
  setMsg('💡 ' + (h || 'Lies die Aufgabe noch einmal in Ruhe.'));
  if(t.hintEn) speakEn(t.hintEn);
  else if(t.hintSay) speakDe(t.hintSay);
  else if(klasse() === 1 && h && !t.quietHint) speakDe(strip(h));
}
function xNext(){
  X.i++;
  if(X.i >= X.d.n) exResult();
  else { loadTask(); window.scrollTo(0, 0); }
}
function exResult(){
  const id = X.d.id, n = X.d.n;
  S.ex = S.ex || {};
  const r = S.ex[id] || (S.ex[id] = {best:0, rounds:0});
  r.best = Math.max(r.best, X.right); r.rounds++; r.last = X.right; r.t = Date.now();
  save(); updateStarsTotal();
  if(X.right >= 8) celebrate();
  $('#app').innerHTML = `<div class="panel center">
    <div style="font-size:70px">${X.right === n ? '🏆' : (X.right >= 7 ? '👏' : '💪')}</div>
    <h1>${X.right} von ${n} auf Anhieb richtig</h1>
    <p class="sub">${X.right === n ? 'Alles beim ersten Versuch – super!' : 'Mit jeder Runde wird es leichter. Probier es gleich nochmal!'}</p>
    <div style="font-size:38px;margin-bottom:8px">${exStarHTML(id)}</div>
    <p class="muted" style="margin:0 0 16px">⭐ ab 5 richtig · ⭐⭐ ab 8 · ⭐⭐⭐ bei 10 von 10</p>
    <div class="row center"><button class="btn primary" data-act="ex" data-id="${id}">🔁 Nochmal</button>
      <button class="btn" data-act="fach" data-id="${X.d.fach}">Zurück zum Menü</button></div></div>`;
  window.scrollTo(0, 0);
}

addEx({id:'m1-zaehlen', klasse:1, fach:'mathe', title:'Mengen zählen', emo:'🍎', desc:'Wie viele siehst du?',
  gen(){
    const n = rnd(1, 10), e = pick(['🍎','⭐','🐞','🎈','🐟','🌸','🚗','🍓','🐥','⚽']);
    const rows = n > 5 ? e.repeat(5) + '<br>' + e.repeat(n - 5) : e.repeat(n);
    return choiceTask({key:n, prompt:'Wie viele siehst du?', say:'Wie viele siehst du? Zähle genau.', visual:`<div class="emorow">${rows}</div>`,
      right:n, wrong:numOpts(n, 1, 10).slice(0, 3), optClass:'nums',
      hint:() => n > 5 ? 'In der oberen Reihe sind immer 5. Zähl unten weiter: 6, 7, …' : 'Zeig mit dem Finger auf jedes Bild und zähl laut mit.'});
  }});
addEx({id:'m1-zehner', klasse:1, fach:'mathe', title:'Zehnerfeld', emo:'🔴', desc:'Tippe so viele Kreise an, wie die Zahl zeigt',
  gen(){
    const n = rnd(1, 10);
    return {type:'frame', key:n, answer:n, prompt:'Tippe genau so viele Kreise an, wie die Zahl zeigt.', say:`Tippe ${n} Kreise an.`,
      wrong: c => c < n ? `Du hast ${c} angetippt. Es fehlen noch welche – zähl noch einmal nach.` : `Du hast ${c} angetippt. Das sind zu viele – zähl noch einmal nach.`,
      hint: () => {

  }});

function vocabVis(x, big){
  if(x.sw) return `<span class="sw${big ? ' big' : ''}" style="background:${x.sw}"></span>`;
  if(x.num != null) return `<span class="bignum" style="font-size:${big ? 96 : 56}px">${x.num}</span>`;
  return `<span class="${big ? 'emo-big' : 'emo'}">${x.emo}</span>`;
}
function vocabEx(id, kl, title, emo, bank, modes){
  addEx({id, klasse:kl, fach:'englisch', title, emo, desc: kl === 1 ? 'Hören und das richtige Bild antippen' : 'Hören, lesen und übersetzen',
    gen(){
      const it = pick(bank), others = pickN(bank, 3, it), mode = pick(modes), find = en => bank.find(b => b.en === en);
      const base = {key:it.en, right:it.en, wrong:others.map(o => o.en), after:`<b>${esc(it.en)}</b> = ${esc(it.de)}`, okEn:it.en};
      if(mode === 'hear') return choiceTask(Object.assign(base, {prompt:'Hör zu: Welches Bild passt?', sayEn:it.en, render: v => vocabVis(find(v)), optClass:'pics',
        hint:() => 'Hör noch einmal ganz genau hin.', hintEn:it.en}));
      if(mode === 'read') return choiceTask(Object.assign(base, {prompt:'Wie heißt das auf Englisch?', visual:vocabVis(it, true),
        hint:() => `Auf Deutsch heißt es: <b>${esc(it.de)}</b>.`}));
      return choiceTask(Object.assign(base, {prompt:`Was heißt <b>${esc(it.de)}</b> auf Englisch?`, hint:() => 'So sieht es aus: ' + vocabVis(it)}));
    }});
}

function chartSVG(runs){
  const W = 640, H = 240, P = 40;
  const top = Math.max.apply(null, runs.map(r => r.wpm)) || 10;
  const max = top * 1.15, n = runs.length;
  const x = i => P + (n === 1 ? (W - P*1.5)/2 : i * (W - P*1.5) / (n - 1));
  const y = v => H - P - (v / max) * (H - P*1.6);
  const pts = runs.map((r,i) => x(i).toFixed(1) + ',' + y(r.wpm).toFixed(1)).join(' ');
  const grid = [0, 0.5, 1].map(f => {
    const v = Math.round(top * f);
    return `<line x1="${P}" x2="${W - P/2}" y1="${y(v)}" y2="${y(v)}" stroke="#EFE6D8"/>
      <text x="${P-8}" y="${y(v)+4}" text-anchor="end" font-size="12" fill="#6B6878">${v}</text>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Verlauf der Wörter pro Minute">${grid}
    <polyline points="${pts}" fill="none" stroke="#FF7A59" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    ${runs.map((r,i) => `<circle cx="${x(i)}" cy="${y(r.wpm)}" r="5" fill="#FF7A59"><title>${esc(r.title)}: ${r.wpm} Wörter/Min.</title></circle>`).join('')}
    <text x="${W/2}" y="${H-10}" text-anchor="middle" font-size="12" fill="#6B6878">Stoppuhr-Runden, zeitlich sortiert · Wörter pro Minute</text></svg>`;
}

function saveCustom(){
  const title = $('#cTitle').value.trim(), text = $('#cText').value.trim();
  if(!title || !text){ toast('Bitte Titel und Text eintragen.'); return; }
  if(parseText(text).wordCount < 5){ toast('Der Text ist zu kurz.'); return; }
  const q = [];
  [1,2,3].forEach(k => {
    const qq = $('#cq'+k).value.trim(), a = $('#ca'+k).value.trim();
    const w1 = $('#cw'+k+'a').value.trim(), w2 = $('#cw'+k+'b').value.trim();
    if(qq && a && w1) q.push(w2 ? [qq, a, w1, w2] : [qq, a, w1]);
  });
  S.custom = S.custom || [];
  S.custom.push({id:'c' + Date.now(), theme:$('#cTheme').value, level:+$('#cLevel').value, title, text, q, custom:true});
  save(); toast('Text gespeichert ✔'); renderParents(); window.scrollTo(0, 0);
}
function delCustom(id){
  if(!confirm('Diesen Text wirklich löschen?')) return;
  S.custom = (S.custom || []).filter(c => c.id !== id);
  delete S.runs[id]; delete S.quiz[id]; delete S.done[id];
  save(); renderParents(); updateStarsTotal();
}
function exportData(){
  const blob = new Blob([JSON.stringify(S, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'lesen-lernen-sicherung-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function importData(file){
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const d = JSON.parse(fr.result);
      if(!d || typeof d !== 'object' || !d.settings) throw new Error('format');
      S = Object.assign(clone(DEFAULTS), d);
      S.settings = Object.assign(clone(DEFAULTS.settings), d.settings);
      migrate(S);
      save(); toast('Sicherung geladen ✔'); renderParents(); updateStarsTotal();
    }catch(e){ toast('Diese Datei ist keine gültige Sicherung.'); }
  };
  fr.readAsText(file);
}

document.addEventListener('click', e => {

  const actEl = e.target.closest('[data-act]');
  const w = e.target.closest('#reading .w');
  if(w && !actEl){ openWord(+w.dataset.w); return; }
  if(!actEl || actEl.tagName === 'SELECT') return;
  const act = actEl.dataset.act, d = actEl.dataset;
  switch(act){
    case 'home': go('#/'); break;
    case 'theme': go('#/t/' + d.id); break;
    case 'read': go('#/r/' + encodeURIComponent(d.id)); break;
    case 'quiz': go('#/q/' + encodeURIComponent(d.id || R.id || Q.id)); break;
    case 'parents': if(unlocked) go('#/eltern'); else gate(); break;
    case 'klasse': S.settings.klasse = +d.k; save(); renderHome(); updateStarsTotal(); break;
    case 'fach': go('#/f/' + d.id); break;
    case 'lesen': go('#/lesen'); break;
    case 'ex': go('#/u/' + d.id); break;
    case 'xsel': xSel(+d.k); break;
    case 'xkey': xKey(d.v); break;
    case 'xtile': xTile(+d.k); break;
    case 'xslot': xSlot(+d.p); break;
    case 'xdot': xDot(+d.k); break;
    case 'xok': xOk(); break;
    case 'xhelp': xHelp(); break;
    case 'xnext': xNext(); break;
    case 'xsay': speakTask(); break;
    case 'saveName': {
      const v = ($('#nameIn').value || '').trim();
      if(v){ S.settings.names = S.settings.names || {}; S.settings.names[klasse()] = v; save(); renderHome(); }
      break;
    }
    case 'mode': setMode(d.m); window.scrollTo({top:0, behavior:'smooth'}); break;
    case 'fs':
      S.settings.fs = clamp(S.settings.fs + +d.d, 20, 48); save();
      $('#reading').style.setProperty('--fs', S.settings.fs + 'px'); break;
    case 'syl':
      S.settings.syl = !S.settings.syl; save();
      actEl.setAttribute('aria-pressed', S.settings.syl); renderText(); break;
    case 'focus':
      S.settings.focus = !S.settings.focus; save();
      actEl.setAttribute('aria-pressed', S.settings.focus); R.cur = Math.max(0, R.cur); renderText(); renderPanel(); applyCur(); break;
    case 'prev':
      if(R.mode === 'zusammen') tandemPrev(); else setCur(R.cur - 1); break;
    case 'next':
      if(R.mode === 'zusammen') tandemNext(); else setCur(R.cur + 1); break;
    case 'speak': startVorlesen(); break;
    case 'stopSpeak': stopVorlesen(); break;
    case 'markDone':
      S.done[R.id] = true; save(); updateStarsTotal(); celebrate();
      R.phase = 'done'; renderPanel(); window.scrollTo({top:0, behavior:'smooth'}); break;
    case 'opt': R.opt = d.v; renderPanel(); break;
    case 'start': startRun(); break;
    case 'finish': finishRun(); break;
    case 'cancel': cancelRun(); break;
    case 'again':
      if(R.mode === 'zusammen'){ R.swap = !R.swap; R.phase = 'idle'; R.cur = 0; renderText(); renderPanel(); maybeTabletSpeak(); }
      else { R.phase = 'idle'; R.readPtr = 0; R.cur = 0; renderText(); renderPanel(); }
      window.scrollTo({top:0, behavior:'smooth'}); break;
    case 'sayWord': sayWord(d.w); break;
    case 'closeModal': closeModal(); break;
    case 'ans': answer(+d.a); break;
    case 'qnext': quizNext(); break;
    case 'sayQ': if(TTS.ok){ stopSpeech(); speechSynthesis.speak(utter(Q.t.q[Q.i][0])); } break;
    case 'peek': peek(); break;
    case 'gateOk': {
      const i = $('#gateIn');
      if(i && +i.value === +d.r){ unlocked = true; closeModal(); go('#/eltern'); }
      else if(i){ i.value = ''; i.classList.remove('shake'); void i.offsetWidth; i.classList.add('shake'); }
      break;
    }
    case 'saveCustom': saveCustom(); break;
    case 'delCustom': delCustom(d.id); break;
    case 'export': exportData(); break;
    case 'reset':
      if(confirm('Wirklich den gesamten Lese-Fortschritt löschen? Einstellungen und eigene Texte bleiben erhalten.')){
        S.runs = {}; S.quiz = {}; S.done = {}; S.ex = {}; save(); updateStarsTotal(); renderParents(); toast('Fortschritt gelöscht');
      }
      break;
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if(el.id === 'importIn' && el.files && el.files[0]){ importData(el.files[0]); el.value = ''; return; }
  const key = el.dataset && el.dataset.set; if(!key) return;
  if(key === 'name1' || key === 'name3'){
    S.settings.names = S.settings.names || {}; S.settings.names[key.slice(4)] = String(el.value).trim(); save(); toast('Gespeichert ✔'); return;
  }
  let v = el.type === 'checkbox' ? el.checked : el.value;
  if(key === 'rate') v = +v;
  if(key === 'childName' || key === 'parentName') v = String(v).trim();
  S.settings[key] = v; save();
  if(location.hash.indexOf('eltern') !== -1) toast('Gespeichert ✔');
});
document.addEventListener('keydown', e => {
  if(e.key !== 'Enter') return;
  if(e.target.id === 'nameIn'){ const b = $('[data-act="saveName"]'); if(b) b.click(); }
  if(e.target.id === 'gateIn'){ const b = $('[data-act="gateOk"]'); if(b) b.click(); }
});
document.addEventListener('visibilitychange', () => { if(document.hidden && R && R.speaking) stopVorlesen(); });

route();
</script>
</body>
